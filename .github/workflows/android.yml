name: android
 
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor (standard = Android 13+, legacy = Android 10+, optimized = Android 15+)
        type: choice
        default: standard
        options:
          - standard
          - legacy
          - optimized
      build_type:
        description: Gradle build type
        type: choice
        default: Release
        options:
          - Release
          - RelWithDebInfo
          - Debug
      publish_release:
        description: Publish the APK as a GitHub pre-release
        type: boolean
        default: false
  # Once a day, an hour after sync-upstream.yml. Skipped when nx2 has not moved since the last
  # successful scheduled build. Scheduled runs build the default branch (nx2).
  schedule:
    - cron: "17 4 * * *"
 
permissions:
  contents: read
 
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
 
env:
  FLAVOR: ${{ inputs.flavor || 'standard' }}
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  # NDK, CMake and the Android platform are read from src/android/app/build.gradle.kts by the
  # "Read toolchain versions" step, so they cannot drift from what the build asks for.
  BUILD_TOOLS_VERSION: "36.0.0"
 
jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide whether to build
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual runs always build.
          if [ "$EVENT" != schedule ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml \
            --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "nx2 is still at ${GITHUB_SHA::7}, the last scheduled build. Skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
 
  build:
    name: Android arm64-v8a APK
    needs: check
    if: needs.check.outputs.build == 'true'
    # The NDK only ships x86_64 Linux host toolchains, so cross-compile from the normal runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE: "true"
    steps:
      # The runner has ~14 GB free; the NDK, CPM sources, FFmpeg and the native build need more.
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /
 
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.gradle.kts derives versionName from `git describe`
 
      # Lichii's Android app only lists container files (.nsp, .xci, ...), so Switch 2 games kept as
      # loose folders (exefs/main) never show up. loose-exefs.patch adds a "Launch ExeFS game folder"
      # menu and lists loose games from your game folders. It is applied here at build time and never
      # committed, so syncing with upstream cannot conflict with it. If upstream later changes the same
      # lines, this step fails and says so instead of silently building an app without the feature.
      - name: Apply loose-folder patch
        shell: bash
        run: |
          set -euo pipefail
          test -f loose-exefs.patch || { echo "::error::loose-exefs.patch is missing from the repo root"; exit 1; }
          git apply --ignore-whitespace --verbose loose-exefs.patch || {
            echo "::error::loose-exefs.patch no longer applies to upstream. Send the log to whoever made it."
            exit 1
          }
 
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache ninja-build nasm autoconf automake libtool pkg-config \
            glslang-tools spirv-tools git
 
      # Install exactly the NDK/CMake/platform the Gradle config asks for. Changing ndkVersion in
      # build.gradle.kts is then the only place to touch.
      - name: Read toolchain versions from Gradle config
        shell: bash
        run: |
          set -euo pipefail
          f=src/android/app/build.gradle.kts
          ndk=$(grep -m1 -oP 'ndkVersion = "\K[^"]+' "$f" || true)
          cmake=$(grep -m1 -oP '^\s*version = "\K3\.[0-9.]+(?=")' "$f" || true)
          platform=$(grep -m1 -oP 'compileSdkVersion = "\K[^"]+' "$f" || true)
          if [ -z "$ndk" ] || [ -z "$cmake" ] || [ -z "$platform" ]; then
            echo "::error::Could not read ndkVersion / cmake version / compileSdkVersion from $f"
            exit 1
          fi
          echo "NDK $ndk, CMake $cmake, platform $platform"
          {
            echo "NDK_VERSION=$ndk"
            echo "CMAKE_VERSION=$cmake"
            echo "ANDROID_PLATFORM=$platform"
          } >> "$GITHUB_ENV"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-android-
 
      # The sha in the key makes every run save a fresh cache; restore-keys seeds it from the newest.
      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: objects-android-${{ env.FLAVOR }}-${{ github.sha }}
          restore-keys: |
            objects-android-${{ env.FLAVOR }}-
            objects-android-
 
      # Without ANDROID_KEYSTORE_B64 the build signs with the repo's debug.keystore, which is
      # fine for sideloading. Add the four secrets below to sign with your own key instead.
      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./.ci/android/build.sh -t "$FLAVOR" -b "$BUILD_TYPE"
          ccache --show-stats || true
 
      - name: Rename outputs
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          for apk in *.apk; do
            mv "$apk" "lichii-android-arm64-v8a-${FLAVOR}-${BUILD_TYPE}-${GITHUB_SHA::7}.apk"
          done
          ls -la
 
      # archive: false uploads the single .apk as is, with no zip around it. The artifact is then
      # named after the file, which the previous step already gave a descriptive name.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
 
      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-logs-${{ github.run_number }}
          path: |
            src/android/app/.cxx/**/*.txt
            src/android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 3
 
  release:
    name: Publish pre-release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Non-zipped artifacts need download-artifact v8.
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          pattern: lichii-android-arm64-v8a-${{ inputs.flavor }}-${{ inputs.build_type }}-*
          path: apk
          merge-multiple: true
 
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Lichii Android build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Android arm64-v8a build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Flavor: ${{ inputs.flavor }}, type: ${{ inputs.build_type }}. No keys, firmware or games included."
 
